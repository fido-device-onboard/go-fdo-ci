name: E2E Testing

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      CI_REF:
        description: "go-fdo-ci ref (branch, tag, or refs/pull/N/head)"
        default: "main"
      SERVER_REF:
        description: "go-fdo-server ref (branch, tag, or refs/pull/N/head)"
        default: "main"
      CLIENT_REF:
        description: "go-fdo-client ref (branch, tag, or refs/pull/N/head)"
        default: "main"
      INSTALLATION_SOURCE:
        description: "Installation source for both server and client (source, copr, distro, compose)"
        default: "source"
      SERVER_INSTALLATION_SOURCE:
        description: "Override installation source for server only"
      CLIENT_INSTALLATION_SOURCE:
        description: "Override installation source for client only"
      COPR_REPO:
        description: "COPR repository for 'copr' installation source"
        default: "@fedora-iot/fedora-iot"
      CLIENT_COPR_REPO:
        description: "Override COPR repository for go-fdo-client only"
      SERVER_COPR_REPO:
        description: "Override COPR repository for go-fdo-server only"
      COMPOSE_BASE_URL:
        description: "Base URL for 'compose' installation source"
      COMPOSE_STREAMS:
        description: "Compose streams to enable (space-separated, e.g. 'BaseOS AppStream')"
      DEBUG:
        description: "Enable verbose debug logging (0 or 1)"
        default: "0"

jobs:
  setup:
    name: "Setup test matrix"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Check out go-fdo-ci
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: fido-device-onboard/go-fdo-ci
          ref: ${{ inputs.CI_REF || github.ref }}
      - id: generate
        # Build the matrix dynamically from the test files on disk.
        # jq is pre-installed on GitHub runners.
        run: |
          matrix=$(
            for dir in test/ci test/container; do
              type=$([[ "${dir}" == "test/ci" ]] && echo "Native" || echo "Container")
              for f in $(find "${dir}" -name 'test-*\.sh' -type f); do
                test=$(basename "${f}")
                jq -n --arg test "${test}" --arg type "${type}" --arg dir "${dir}" --arg name "${test/.sh/}" \
                  '{test: $test, type: $type, dir: $dir, name: $name}'
              done
            done | jq -cs '{include: .}'
          )
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  e2e:
    name: "${{ matrix.type }}: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Install golang
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      - name: Check out go-fdo-ci
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: fido-device-onboard/go-fdo-ci
          ref: ${{ inputs.CI_REF || github.ref }}

      - name: ${{ matrix.name }}
        env:
          SERVER_REF: ${{ inputs.SERVER_REF || "main" }}
          CLIENT_REF: ${{ inputs.CLIENT_REF || "main" }}
          INSTALLATION_SOURCE: ${{ inputs.INSTALLATION_SOURCE || "source" }}
          SERVER_INSTALLATION_SOURCE: ${{ inputs.SERVER_INSTALLATION_SOURCE }}
          CLIENT_INSTALLATION_SOURCE: ${{ inputs.CLIENT_INSTALLATION_SOURCE }}
          COPR_REPO: ${{ inputs.COPR_REPO }}
          CLIENT_COPR_REPO: ${{ inputs.CLIENT_COPR_REPO }}
          SERVER_COPR_REPO: ${{ inputs.SERVER_COPR_REPO }}
          COMPOSE_BASE_URL: ${{ inputs.COMPOSE_BASE_URL }}
          COMPOSE_STREAMS: ${{ inputs.COMPOSE_STREAMS }}
          DEBUG: ${{ inputs.DEBUG }}
        run: |
          source ${{ matrix.dir }}/${{ matrix.test }}
          run_test

      - name: Get Manufacturer, Rendezvous and Owner server logs
        if: always()
        run: |
          source ${{ matrix.dir }}/${{ matrix.test }}
          get_logs

      - name: Cleanup the environment
        if: always()
        run: |
          source ${{ matrix.dir }}/${{ matrix.test }}
          cleanup
